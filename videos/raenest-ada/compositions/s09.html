<script>
(() => {
const tl = gsap.timeline({ paused: true });

const $ = (s) => document.querySelector(s);

const CV = document.createElement('canvas').getContext('2d');
function inn(el, from, to, t){ tl.fromTo(el, from, Object.assign({ease:'expo.out',duration:.7}, to), t); }

function prep(sel){
  const el=$(sel), cs=getComputedStyle(el), fs=parseFloat(cs.fontSize);
  const font=cs.fontWeight+' '+fs+'px Inter';
  const tw=el.classList.contains('tw'), chain=el.classList.contains('chain');
  const gap=tw?0:fs*.26; const toks=Array.from(el.querySelectorAll(':scope > .tk')); let acc=0; const ends=[];
  toks.forEach((t,i)=>{ CV.font=(t.dataset.w||cs.fontWeight)+' '+fs+'px Inter';
    let w=CV.measureText(t.textContent).width;
    if(t.classList.contains('chip')) w+=fs*.56;
    if(chain) w+= t.classList.contains('ar') ? 36 : 52;
    acc+=(i?gap:0)+w; ends.push(acc); });
  return {el,toks,ends};
}
// a centred line that grows token by token and re-centres as it grows
function grow(sel, times, o){ o=o||{}; const L=prep(sel), E=L.ends;
  tl.fromTo(L.el,{x:-E[0]/2},{x:-E[0]/2,duration:.01},0);
  L.toks.forEach((t,i)=>{ const at=times[Math.min(i,times.length-1)] + (i>=times.length?(i-times.length+1)*(o.step||.06):0);
    tl.fromTo(t,{opacity:0,filter:o.tw?'blur(0px)':'blur(8px)'},{opacity:1,filter:'blur(0px)',duration:o.tw?.01:.2,ease:'power2.out'},at);
    if(i>0) tl.fromTo(L.el,{x:-E[i-1]/2},{x:-E[i]/2,duration:o.tw?.12:.4,ease:'power3.out',immediateRender:false},at);
    if(t.classList.contains('chip')||t.classList.contains('ar')||t.classList.contains('bx')) tl.fromTo(t,{scale:.55},{scale:1,duration:.45,ease:'back.out(1.7)'},at);
    if(o.caret){ tl.fromTo(o.caret,{x:i?E[i-1]:0},{x:E[i],duration:.01,immediateRender:i===0},at); }
  });
  return L;
}
function words(sel, times){ $$(sel+' .tk').forEach((w,i)=>{ const at=times[Math.min(i,times.length-1)]+(i>=times.length?(i-times.length+1)*.07:0);
  tl.fromTo(w,{opacity:0,filter:'blur(8px)'},{opacity:1,filter:'blur(0px)',duration:.2,ease:'power2.out'},at); }); }
function tint(sel, times, from){ $$(sel+' .tk').forEach((w,i)=>{ const at=times[Math.min(i,times.length-1)]+(i>=times.length?(i-times.length+1)*.07:0);
  const to=getComputedStyle(w).color; tl.fromTo(w,{color:from},{color:to,duration:.25,ease:'power2.out'},at); }); }
function roll(sel, t){ tl.fromTo(sel+' .strip',{yPercent:0},{yPercent:-50,duration:.55,ease:'power3.inOut'},t);
  tl.fromTo(sel+' .strip span:first-child',{opacity:1},{opacity:0,duration:.4},t+.05);
  tl.fromTo(sel+' .strip span:last-child',{opacity:0},{opacity:1,duration:.4},t+.1); }
function flood(sel, t, x, y, r){ tl.fromTo(sel,{clipPath:`circle(0px at ${x}px ${y}px)`},{clipPath:`circle(${r||2300}px at ${x}px ${y}px)`,duration:.5,ease:'power2.inOut'},t); }
function count(sel, a, b, dec, t, d){ const o={v:a}, e=$(sel); e.textContent=a.toFixed(dec);
  tl.fromTo(o,{v:a},{v:b,duration:d,ease:'power2.out',onUpdate:()=>{e.textContent=o.v.toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});}},t); }
// big cursor: path of [t,x,y] points (x,y = tip position in frame px), clicks at given times
function cursor(sel, pts, clicks){ const c=$(sel); const ox=11, oy=6;
  tl.fromTo(c,{x:pts[0][1]-ox,y:pts[0][2]-oy,opacity:0},{opacity:1,duration:.2},pts[0][0]);
  for(let i=1;i<pts.length;i++){ const p=pts[i-1], q=pts[i];
    tl.fromTo(c,{x:p[1]-ox,y:p[2]-oy},{x:q[1]-ox,y:q[2]-oy,duration:Math.max(.3,q[0]-p[0]-.05),ease:'power3.inOut',immediateRender:false},p[0]+.05); }
  (clicks||[]).forEach(t=>{ tl.fromTo(c,{scale:1},{scale:.8,duration:.08,ease:'power2.in',immediateRender:false},t);
    tl.fromTo(c,{scale:.8},{scale:1,duration:.18,ease:'power2.out',immediateRender:false},t+.08); }); }
// gradient wipe: blurred circles of the next colour pop in from one side, then the full fill settles
function gwipe(sel, t, d){ d=d||.6; const cs=$$(sel+' i'), n=cs.length;
  cs.forEach((c,k)=>{ tl.fromTo(c,{opacity:0,scale:.25},{opacity:1,scale:1,duration:.38,ease:'power2.out'},t+k*(d*.7/n)); });
  tl.fromTo(sel+' b',{opacity:0},{opacity:1,duration:.22,ease:'power2.in'},t+d*.62); }
// gradient flow: the blurred wave layers drift slowly for the whole scene
function meshes(){ $$('.mesh').forEach(m=>{ const d=+m.dataset.d; Array.from(m.querySelectorAll('path')).forEach((q,i)=>{ const sx=(i%2?1:-1)*(60+i*25);
  tl.fromTo(q,{x:-sx,y:(i-1)*-18},{x:sx,y:(i-1)*18,duration:d,ease:'sine.inOut'},0); }); }); }
